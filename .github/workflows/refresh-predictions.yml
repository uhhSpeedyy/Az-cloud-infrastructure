name: Refresh AFL predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 2"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh the next round after completed results are published
        env:
          AFL_REFRESH_TOKEN: ${{ secrets.AFL_REFRESH_TOKEN }}
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-all-errors --max-time 230 \
            -X POST "https://sam-speed.azurewebsites.net/api/admin/refresh" \
            -H "Authorization: Bearer ${AFL_REFRESH_TOKEN}" \
            -H "Content-Type: application/json"
